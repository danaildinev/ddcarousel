name: Tests & Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup env
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TS check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build:all