<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DDCarousel Demos</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t } catch { }</script>
	<link rel="stylesheet" href="css/ddcarousel.min.css" />
	<link rel="stylesheet" href="css/demos.css" />
	<link
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
		rel="stylesheet">
</head>

<body>
	<header class="main-header">
		<div class="container">
			<div class="main-header__left">
				<button class="main-header__link main-header__toggle-sidebar" type="button">
					<svg class="svg-icon" viewBox="0 0 24 24" fill="none">
						<path d="M4 18L20 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
						<path d="M4 12L20 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
						<path d="M4 6L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
					</svg>
				</button>
			</div>
			<div class="main-header__content">
				<a href="#" class="main-header__title">DDCarousel demos</a>
			</div>
			<div class="main-header__right">
				<nav class="main-header__links">
					<a class="main-header__link" href="https://github.com/danaildinev/ddcarousel" target="_blank">
						<svg class="svg-icon" viewBox="0 0 16 16" fill="currentColor">
							<path fill-rule="evenodd" clip-rule="evenodd"
								d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z" />
						</svg>
						<span class="main-header__link--text">GitHub</span>
					</a>
					<button id="theme-toggle" class="main-header__link" type="button">
						<svg class="svg-icon theme-icon" viewBox="0 0 24 24" fill="currentColor">
							<mask id="moon-mask">
								<rect x="0" y="0" width="100%" height="100%" fill="white" />
								<circle class="mask-circle" cx="24" cy="4" r="6" fill="black" />
							</mask>
							<circle class="sun-center" cx="12" cy="12" r="5" mask="url(#moon-mask)" />
							<g class="sun-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
								<line x1="12" y1="1" x2="12" y2="3" />
								<line x1="12" y1="21" x2="12" y2="23" />
								<line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
								<line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
								<line x1="1" y1="12" x2="3" y2="12" />
								<line x1="21" y1="12" x2="23" y2="12" />
								<line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
								<line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
							</g>
						</svg>
					</button>
				</nav>
			</div>
		</div>
	</header>
	<div class="demos">
		<nav class="demos__sidebar">
			<button type="button" class="demos__close-btn">
				<svg class="svg-icon" viewBox="0 0 24 24" fill="none">
					<path d="M5 19L19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
					<path d="M5 5L19 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
				</svg>
			</button>
			<h3 class="demos__sidebar-title">General</h3>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="default">
						<span class="demos__title">Default</span>
						<span class="demos__description">Default carousel settings</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="fixedHeight">
						<span class="demos__title">Fixed carousel height</span>
						<span class="demos__description">Use default carousel height with slides set to match carousel
							height</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="itemsPerPage">
						<span class="demos__title">Items per page</span>
						<span class="demos__description">Multiple items per page</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="startPage">
						<span class="demos__title">Start page</span>
						<span class="demos__description">Set a custom startin page</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="gap">
						<span class="demos__title">Gap</span>
						<span class="demos__description">Space between slides</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="vertical">
						<span class="demos__title">Vertical orientation</span>
						<span class="demos__description">Vertical carousel with two slides per page</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="verticalMaxContentWidth">
						<span class="demos__title">Vertical orientation with auto width</span>
						<span class="demos__description">Vertical carousel with two slides per page and auto width
							based on longest slide</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="responsive">
						<span class="demos__title">Responsive</span>
						<span class="demos__description">Different carousel settings based on viewport width.</span>
						<span class="demos__meta">The current responsive breakpoints are highly customized and
							configured to work well with this demo. In real-world scenarios, you may need to define your
							own breakpoints (e.g. 1300px, 1024px, 768px).
						</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="touchDrag">
						<span class="demos__title">Touch drag</span>
						<span class="demos__description">Enabled only touch drag</span>
					</button>
				</li>

				<li>
					<button type="button" class="demos__list-drag" data-demo="dragSnapMode">
						<span class="demos__title">Touch drag snap mode</span>
						<span class="demos__description">Control how the target slide is selected after dragging</span>
						<span class="demos__meta">"swipe" follows the drag direction, while "closest" snaps to the
							nearest slide when released.</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="mouseDrag">
						<span class="demos__title">Mouse drag</span>
						<span class="demos__description">Enabled only mouse drag</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="centered">
						<span class="demos__title">Centered slide</span>
						<span class="demos__description">Multiple visible slides with the active slide centered.</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="keyboardNav">
						<span class="demos__title">Keyboard navigation</span>
						<span class="demos__description">Navigate between pages using the keyboard arrow keys.</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="swipeThreshold">
						<span class="demos__title">Swipe threshold</span>
						<span class="demos__description">Set a custom drag distance required to trigger a page
							change</span>
						<span class="demos__meta">Swipe harder/longer to trigger page change</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="dragMaxDistance">
						<span class="demos__title">Drag max distance</span>
						<span class="demos__description">Set a custom maximum allowed drag distance</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="resizeDebounce">
						<span class="demos__title">Custom resize debounce</span>
						<span class="demos__description">Set a custom delay before recalculating the carousel after
							resizing.</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="swipeSmooth">
						<span class="demos__title">Swipe smoothing</span>
						<span class="demos__description">Set a custom drag movement smoothing</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="slideChangeDuration">
						<span class="demos__title">Slide change duration</span>
						<span class="demos__description">Set a custom slide change duration</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="events">
						<span class="demos__title">Events</span>
						<span class="demos__description">Visual representation of firing different events</span>
					</button>
				</li>

			</ul>

			<h3 class="demos__sidebar-title">Modules</h3>

			<h4 class="demos__sidebar-sub-title">Navigation</h4>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="nav">
						<span class="demos__title">Navigation</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="navCustomButtons">
						<span class="demos__title">Navigation with custom buttons</span>
					</button>
				</li>
			</ul>

			<h4 class="demos__sidebar-sub-title">Autoplay</h4>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="autoplay">
						<span class="demos__title">Autoplay</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="autoplaySpeedNoProgress">
						<span class="demos__title">Autoplay speed with disabled progress bar</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="autoplayPause">
						<span class="demos__title">Autoplay pause on hover or tab hidden</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="autoplayEvents">
						<span class="demos__title">Autoplay events</span>
						<span class="demos__meta">Hover with a mouse over the carousel or change tab to trigger manually
							events.</span>
					</button>
				</li>
			</ul>

			<h4 class="demos__sidebar-sub-title">Pagination</h4>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="pagination">
						<span class="demos__title">Pagination</span>
					</button>
				</li>
			</ul>

			<h4 class="demos__sidebar-sub-title">Lazy Load</h4>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="lazyLoad">
						<span class="demos__title">Lazy loading</span>
						<span class="demos__description">Lazy load active images and preload upcoming slides.</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="lazyLoadPreload">
						<span class="demos__title">Lazy loading preload</span>
						<span class="demos__description">Preload upcoming slides with a custom number of slides to
							preload</span>
					</button>
				</li>
			</ul>

			<h4 class="demos__sidebar-sub-title">URL Navigation</h4>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="urlNav">
						<span class="demos__title">URL navigation</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="urlNavContainer">
						<span class="demos__title">URL navigation in a custom container</span>
					</button>
				</li>
			</ul>

			<h4 class="demos__sidebar-sub-title">Loop</h4>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="loop">
						<span class="demos__title">Loop/infinite scroll</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="loopMultipleItemsPerPage">
						<span class="demos__title">Loop on multiple items per page</span>
					</button>
				</li>

				<li>
					<button type="button" data-demo="loopMultipleItemsPerPageAndCentered">
						<span class="demos__title">Loop on centered slide and multiple items per page</span>
					</button>
				</li>
			</ul>
		</nav>

		<section class="demo__preview">
			<header class="demo__preview-header">
				<h2 class="demo__preview-title"></h2>
				<p class="demo__preview-description"></p>
				<span class="demo__preview-meta"></span>
			</header>

			<div class="demo__preview-content"></div>

			<footer class="demo__preview-footer">
				<div class="demo__preview-actions"></div>
				<div class="demo__preview-extra"></div>
			</footer>

			<div class="demo__preview-events"></div>
		</section>
	</div>

	<dialog id="statusPopup">
		<div id="statusPopup__header">
			<h4 id="statusPopup__title"></h4>
			<button type="button" class="btn" id="statusPopup__close">
				<svg class="svg-icon" viewBox="0 0 24 24" fill="none">
					<path d="M5 19L19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
					<path d="M5 5L19 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
				</svg>
			</button>
		</div>

		<pre id="statusPopup__content"></pre>
	</dialog>

</body>
<script src="js/ddcarousel.umd.min.js"></script>
<script type="module" src="js/main.js"></script>

</html>
