<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DDCarousel Demos</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="css/ddcarousel.min.css" />
	<link rel="stylesheet" href="css/demos.css" />
	<link
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
		rel="stylesheet">
</head>

<body>
	<header class="main-header">
		<div class="container">
			<div class="main-header__content">
				<h1 class="main-header__logo">DDCarousel demos</h1>
				<a class="main-header__link" href="https://github.com/danaildinev/ddcarousel"
					target="_blank">github.com/danaildinev/ddcarousel</a>
			</div>
		</div>
	</header>
	<div class="demos">
		<section class="demos__sidebar">
			<h4 class="demos__sidebar-title">General</h4>
			<ul class="demos__list">
				<li>
					<button type="button" data-demo="#default">
						<h3 class="demos__title">Default</h3>
						<span class="demos__description">Default carousel settings.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#disabledMouse">
						<h3 class="demos__title">Disabled mouse drag</h3>
						<span class="demos__description">Default carousel with mouse dragging disabled.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#multiple">
						<h3 class="demos__title">Multiple slides + navigation</h3>
						<span class="demos__description">Carousel with 3 slides per page and navigation.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#centered">
						<h3 class="demos__title">Centered slide</h3>
						<span class="demos__description">Multiple visible slides with the active slide
							centered.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#autoHeight">
						<h3 class="demos__title">Auto height + one item per page</h3>
						<span class="demos__description">Automatically adjust carousel height on slide change based
							on
							the highest visible slide and change one item per page</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#responsive">
						<h3 class="demos__title">Responsive + full width</h3>
						<span class="demos__description">Different carousel settings based on viewport width.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#vertical">
						<h3 class="demos__title">Vertical orientation</h3>
						<span class="demos__description">Vertical carousel with two slides per page and a custom
							starting
							page.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#urlnav">
						<h3 class="demos__title">URL navigation</h3>
						<span class="demos__description">Control the carousel with links generated from slide
							data.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#lazydemo">
						<h3 class="demos__title">Lazy loading</h3>
						<span class="demos__description">Lazy load active images and preload upcoming slides.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#autoplay">
						<h3 class="demos__title">Autoplay</h3>
						<span class="demos__description">Automatic slide changes with pause controls and progress
							bar.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#disabledTouch">
						<h3 class="demos__title">Disabled touch drag</h3>
						<span class="demos__description">Touch dragging disabled while mouse dragging remains
							enabled.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#customLabels">
						<h3 class="demos__title">Custom navigation labels</h3>
						<span class="demos__description">Use custom content for the previous and next navigation
							controls.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#customanim">
						<h3 class="demos__title">Custom animation config</h3>
						<span class="demos__description">Customized swipe thresholds, drag distance and animation
							behavior.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#keyboardNav">
						<h3 class="demos__title">Keyboard navigation</h3>
						<span class="demos__description">Navigate between pages using the keyboard arrow
							keys.</span>
					</button>
				</li>
				<li>
					<button type="button" data-demo="#events">
						<h3 class="demos__title">Events + methods</h3>
						<span class="demos__description">Explore carousel events, runtime state and public
							methods.</span>
						<span class="demos__meta">Short and full/detailed event output.</span>
					</button>
				</li>
			</ul>
		</section>
		<section class="demos__preview">
			<header class="demos__preview-header">
				<h2 class="demos__preview-title">Preview title</h2>
				<p class="demos__preview-description">Preview description</p>
				<span class="demos__preview-meta">Preview meta</span>
			</header>

			<div class="demos__preview-content">
				Slider content
			</div>

			<footer class="demos__preview-footer">
				<div class="demos__preview-actions">Actions</div>
				<div class="demos__preview-extra">Extra</div>
			</footer>
		</section>
	</div>
</body>
<script src="js/ddcarousel.umd.min.js"></script>
<script src="js/main.js"></script>

</html>
